services:
  backend:
    image: ghcr.io/joao-monticelli/netcable-backend:latest
    container_name: netcable_backend
    restart: unless-stopped
    # A porta fica disponível apenas na rede interna do Compose.
    volumes:
      - /mnt/ssd-apps/vm/netcable:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=altere_esta_senha
      - SECRET_KEY=altere_esta_chave_por_uma_string_longa_e_aleatoria
      - ALLOWED_ORIGINS=http://localhost
      # Opcional: URL que receberá alertas quando um equipamento ficar offline.
      # - ALERT_WEBHOOK_URL=https://seu-endpoint.example/alertas

  frontend:
    image: ghcr.io/joao-monticelli/netcable-frontend:latest
    container_name: netcable_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
