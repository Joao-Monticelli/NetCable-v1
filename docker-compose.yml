services:
  backend:
    build:
      context: https://github.com/Joao-Monticelli/NetCable-v1.git#main
      dockerfile: backend/Dockerfile
    container_name: netcable_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /mnt/ssd-apps/vm/netcable:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: https://github.com/Joao-Monticelli/NetCable-v1.git#main
      dockerfile: frontend/Dockerfile
    container_name: netcable_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend