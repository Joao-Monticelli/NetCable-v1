services:
  netcable:
    image: ghcr.io/joao-monticelli/netcable:latest
    container_name: netcable
    restart: unless-stopped
    ports:
      - "3080:8080"   # acesse http://IP_DO_TRUENAS:3080
    environment:
      - TZ=America/Sao_Paulo
      # Opcional: alertas no Telegram
      # - TELEGRAM_BOT_TOKEN=123456:ABC...
      # - TELEGRAM_CHAT_ID=-1001234567890
    volumes:
      # =======================================================
      # 👇 ALTERE AQUI: CAMINHO DO POOL ONDE OS DADOS SERÃO SALVOS 👇
      # =======================================================
      - /mnt/SEU_POOL/apps/netcable:/app/data
